name: Repo Steward CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate policy JSON
        run: python -m json.tool manifests/repo-steward-policy.json >/dev/null
      - name: Compile
        run: python -m compileall -q repo_steward tests
      - name: Tests
        run: python -m unittest discover -s tests -v
