name: Validate Estate Wrapper

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate estate manifest
        run: python scripts/validate_estate.py

      - name: Test estate protection tooling
        run: python scripts/test_estate_protection.py
